<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redacted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REDACTED — the game (folio look, kept as simple as possible)
   Quotes live in quotes.js; this file is the whole game.
   ============================================================ */
:root{
  --paper:#f6f2e8; --page:#fbf8f1; --ink:#211d15; --muted:#6b6353;
  --rule:#ddd5c2; --redact:#17130c; --correct:#3a5741; --miss:#8f3a2a;
  --serif:'EB Garamond', Georgia, serif;
  --t-sm:.85rem; --t-md:1.1rem; --t-lg:1.4rem; --t-xl:1.75rem; --t-2xl:2.6rem;
}
*{box-sizing:border-box; margin:0; padding:0;}
button,input{font-family:inherit; touch-action:manipulation;}
body{font-family:var(--serif); color:var(--ink); background:var(--paper); line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
.page{max-width:600px; margin:2.5rem auto; background:var(--page); border:1px solid var(--rule);
  padding:3.5rem clamp(1.5rem,7vw,4rem); box-shadow:0 18px 40px -32px rgba(40,32,16,.45);}
.screen{display:none;}
.screen.active{display:block;}
.head{text-align:center; font-variant:small-caps; letter-spacing:.35em; font-size:var(--t-sm); color:var(--muted);}
.folio{text-align:center; font-size:var(--t-md); color:var(--muted); margin-top:.4rem;}
.asterism{text-align:center; color:var(--muted); margin:1.6rem 0; letter-spacing:.5em;}
.small{text-align:center; font-variant:small-caps; letter-spacing:.22em; font-size:var(--t-sm); color:var(--muted); margin-top:1.6rem;}
.btn{display:inline-block; font-family:var(--serif); font-size:var(--t-md); background:var(--ink); color:var(--page);
  border:1px solid var(--ink); border-radius:2px; padding:.55em 1.6em; cursor:pointer; white-space:nowrap;}
.btn:hover{opacity:.9;}
.btn.quiet{background:transparent; color:var(--muted); border:none; font-style:italic; font-size:var(--t-sm); text-decoration:underline;}

/* ---------- title ---------- */
h1{text-align:center; font-weight:500; font-size:var(--t-2xl); letter-spacing:.14em; margin-top:1.2rem;}
h1 .tbar{background:var(--redact); color:transparent; padding:0 .08em;}
.standfirst{text-align:center; font-style:italic; font-size:var(--t-lg); color:var(--muted); max-width:34ch; margin:1.2rem auto 0;}
.center{text-align:center; margin-top:2rem;}

/* ---------- quote & redaction bars ---------- */
blockquote{font-size:var(--t-xl); line-height:1.6; margin-top:1.8rem;}
.term{position:relative; display:inline; white-space:nowrap;}
.term .bar{position:absolute; inset:-1px -2px; background:var(--redact); border-radius:1px;}
.play.revealed .term .bar{animation:dissolve 1s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes dissolve{to{opacity:0; filter:blur(3px); transform:scale(1.05);}}
.play.revealed .term.subject .word{border-bottom:1.5px solid var(--correct); font-weight:500;}
@media (prefers-reduced-motion:reduce){.play.revealed .term .bar{animation:none; opacity:0;}}

/* ---------- guess row (fixed-height, browser-stable) ---------- */
.question{text-align:center; font-style:italic; font-size:var(--t-lg); margin:2rem 0 .8rem;}
.row{display:flex; align-items:center; gap:1.2rem;}
.gline{flex:1; min-width:0; display:flex; align-items:center; gap:.45rem; height:2.5rem; border-bottom:1.5px solid var(--ink);}
.gline:focus-within{border-bottom-width:2px;}
.gline input{flex:1; min-width:0; height:100%; font-size:var(--t-lg); font-style:italic; color:var(--ink);
  background:transparent; border:none; outline:none; padding:0 .05em;}
.gline input::placeholder{color:var(--muted); opacity:.6;}
.gmark{flex:none; width:1.5rem; height:1.5rem; border-radius:100px; display:grid; place-items:center;
  border:1.5px solid; font-size:.95rem; line-height:1; font-style:normal; visibility:hidden;}
.gmark.miss{color:var(--miss); border-color:var(--miss);}
.gmark.ok{color:var(--correct); border-color:var(--correct);}
.play.revealed .gmark{visibility:visible;}
.play.revealed .reveal-btn{visibility:hidden;}  /* keeps its footprint: nothing shifts */
.play.revealed .gline input{pointer-events:none;}
.play.revealed.wrong .gline input{color:var(--muted); text-decoration:line-through;
  text-decoration-color:var(--miss); text-decoration-thickness:1.5px;}

/* ---------- in-place reveal panel ---------- */
.panel{max-height:0; opacity:0; overflow:hidden; transition:max-height .5s ease .75s, opacity .5s ease .75s;}
.play.revealed .panel{max-height:340px; opacity:1;}
.answer{font-size:var(--t-lg); margin-top:1.1rem;}
.answer .truth{font-weight:500; border-bottom:1.5px solid var(--correct);}
.answer .ok-word{color:var(--correct);}
.answer .src{font-style:italic; color:var(--muted);}
.note{font-style:italic; color:var(--muted); font-size:var(--t-md); border-top:1px solid var(--rule);
  margin-top:1rem; padding-top:.9rem;}
.panel .center{margin-top:1.4rem;}

/* ---------- the reckoning ---------- */
.cap{text-align:center; font-variant:small-caps; letter-spacing:.28em; font-size:var(--t-sm); margin-top:1.6rem;}
.cap.missy{color:var(--miss);}
.cap.flawless{color:var(--correct);}
.bigline{text-align:center; font-size:var(--t-xl); line-height:1.5; max-width:28ch; margin:.7rem auto 0;}
.bigline .t{border-bottom:1.5px solid var(--correct);}
.bigline .g{font-style:italic; color:var(--miss);}
.score{text-align:center; font-size:var(--t-md); color:var(--muted); font-style:italic; margin-top:1rem;}
.dots{display:flex; justify-content:center; gap:.45rem; margin-top:1rem; flex-wrap:wrap;}
.dots span{width:1.4rem; height:1.4rem; border:1px solid var(--rule); border-radius:100px;
  display:grid; place-items:center; font-size:.75rem; color:var(--muted); font-style:normal;}
.dots .h{color:var(--correct); border-color:var(--correct);}
.dots .n{color:var(--miss); border-color:var(--miss);}

@media (max-width:520px){
  :root{--t-2xl:2rem; --t-xl:1.4rem; --t-lg:1.2rem;}
  .page{margin:1rem auto; padding:2rem 1.25rem;}
  .row{gap:.8rem;}
}
</style>
</head>
<body>

<!-- ============ TITLE ============ -->
<section class="page screen active" id="scr-title">
  <p class="head">A Diversion in Eight Passages</p>
  <h1>RE<span class="tbar" aria-hidden="true">DACT</span>ED</h1>
  <p class="asterism" aria-hidden="true">⁂</p>
  <p class="standfirst">Innovation has always been disruptive, whether it's the wheel or artificial
    intelligence. Read a real reaction, and guess the innovation that sparked it.</p>
  <div class="center"><button class="btn" onclick="begin()">Begin</button></div>
  <p class="small">Eight passages · about four minutes</p>
</section>

<!-- ============ PLAY ============ -->
<section class="page screen play" id="scr-play">
  <p class="head">Redacted</p>
  <p class="folio" id="folio"></p>

  <blockquote id="quote"></blockquote>

  <p class="question" id="ask">What's the innovation?</p>
  <form id="form">
    <div class="row">
      <div class="gline">
        <input id="g" type="text" autocomplete="off" autocapitalize="off"
               placeholder="an innovation…" aria-labelledby="ask">
        <span class="gmark" id="gmark" role="img"></span>
      </div>
      <button class="btn reveal-btn" type="submit">Reveal</button>
    </div>
  </form>

  <div class="panel" aria-live="polite">
    <p class="answer" id="answer"></p>
    <p class="note" id="note"></p>
    <div class="center"><button class="btn" id="next" type="button" onclick="next()">Next passage →</button></div>
  </div>
</section>

<!-- ============ THE RECKONING ============ -->
<section class="page screen" id="scr-end">
  <p class="head">The Reckoning</p>
  <p class="cap" id="endcap"></p>
  <p class="bigline" id="endline"></p>
  <p class="score" id="endscore"></p>
  <div class="dots" id="dots"></div>
  <div class="center">
    <button class="btn" id="share" onclick="share()">Copy &amp; share</button>
    <button class="btn quiet" onclick="begin()">read again</button>
  </div>
</section>

<script src="quotes.js"></script>
<script>
/* ---------- state ---------- */
var i = 0, results = [], guesses = [];
var $ = function(id){ return document.getElementById(id); };
var ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'];

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('active', s.id===id); });
  window.scrollTo(0,0);
}

/* ---------- helpers ---------- */
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function yearStr(y){ return y < 0 ? (-y)+' BC' : String(y); }

/* {{!subject}} and {{detail}} become covered terms; era is never shown pre-reveal */
function quoteHTML(text){
  return esc(text).replace(/\{\{(!?)([^}]+)\}\}/g, function(_, bang, w){
    return '<span class="term'+(bang?' subject':'')+'">'
         + '<span class="word" aria-hidden="true">'+w+'</span>'
         + '<span class="bar" role="img" aria-label="'+(bang?'the innovation, redacted':'redacted')+'"></span></span>';
  });
}

/* loose answer matching: lowercase, drop punctuation and articles */
function norm(s){
  return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an)\b/g,' ')
          .replace(/\s+/g,' ').trim();
}
function isCorrect(guess, q){
  var g = norm(guess);
  if(!g) return false;
  var opts = [q.answer].concat(q.accept||[]).map(norm);
  return opts.some(function(o){
    return o===g || (g.length>=4 && (o.indexOf(g)>-1 || g.indexOf(o)>-1));
  });
}

/* ---------- flow ---------- */
function begin(){
  i = 0; results = []; guesses = [];
  show('scr-play'); loadPassage();
}

function loadPassage(){
  var q = QUOTES[i];
  var play = $('scr-play');
  play.classList.remove('revealed','wrong');
  $('folio').textContent = '· '+ROMAN[i]+' of '+ROMAN[QUOTES.length-1]+' ·';
  $('quote').innerHTML = quoteHTML(q.text);
  $('g').value = ''; $('g').readOnly = false;
  $('g').focus({preventScroll:true});
}

$('form').addEventListener('submit', function(e){
  e.preventDefault();
  /* Enter once = reveal; Enter again = next passage */
  if($('scr-play').classList.contains('revealed')) next(); else reveal();
});

function reveal(){
  var q = QUOTES[i];
  var guess = $('g').value;
  var ok = isCorrect(guess, q);
  results.push(ok); guesses.push(guess);

  var mark = $('gmark');
  mark.textContent = ok ? '✓' : '✗';
  mark.className = 'gmark ' + (ok ? 'ok' : 'miss');
  mark.setAttribute('aria-label', ok ? 'correct' : 'incorrect');

  $('answer').innerHTML = ok
    ? '<span class="ok-word">Just so.</span> — <span class="src">'+esc(q.author)+', <b>'+yearStr(q.year)+'</b>.</span>'
    : 'It was <span class="truth">'+esc(q.answer)+'</span> — <span class="src">'+esc(q.author)+', <b>'+yearStr(q.year)+'</b>.</span>';
  $('note').textContent = q.note || '';

  $('g').readOnly = true;
  var play = $('scr-play');
  play.classList.toggle('wrong', !ok);
  play.classList.add('revealed');
}

function next(){
  i++;
  if(i < QUOTES.length) loadPassage(); else reckoning();
}

/* Biggest miss: if they called anything "AI", the oldest such innovation wins;
   otherwise the oldest innovation they got wrong, with their guess. */
var AI_RE = /\b(a\.?\s?i\.?|artificial intelligence)\b/i;
function biggestMiss(){
  var wrong = [];
  QUOTES.forEach(function(q,k){ if(!results[k]) wrong.push({q:q, guess:guesses[k]}); });
  if(!wrong.length) return null;
  var ai = wrong.filter(function(w){ return AI_RE.test(w.guess); });
  var pool = ai.length ? ai : wrong;
  pool.sort(function(a,b){ return a.q.year - b.q.year; });
  var m = pool[0];
  return { q:m.q, guess: ai.length ? 'artificial intelligence'
                                    : (m.guess.trim() || 'a mystery to me') };
}
function rank(n){
  if(n>=8) return 'unfoolable';
  if(n>=6) return 'hard to fool';
  if(n>=4) return 'reasonably suspicious';
  if(n>=2) return 'credulous, but charming';
  return 'gloriously fooled';
}

function reckoning(){
  var n = results.filter(Boolean).length;
  var miss = biggestMiss();
  if(miss){
    $('endcap').textContent = 'My finest misjudgement';
    $('endcap').className = 'cap missy';
    $('endline').innerHTML = 'I was certain <span class="t">'+esc(miss.q.answer)+'</span> — '
      + yearStr(miss.q.year)+' — was <span class="g">'+esc(miss.guess)+'</span>.';
  }else{
    $('endcap').textContent = 'Flawless';
    $('endcap').className = 'cap flawless';
    $('endline').textContent = 'Nothing got past me. Eight of eight.';
  }
  $('endscore').textContent = 'I named '+n+' of '+QUOTES.length+' — '+rank(n)+'.';
  $('dots').innerHTML = results.map(function(r){
    return '<span class="'+(r?'h':'n')+'">'+(r?'✓':'✗')+'</span>';
  }).join('');
  $('dots').setAttribute('aria-label','Results: '+n+' correct of '+QUOTES.length);
  show('scr-end');
}

/* ---------- share ---------- */
function shareText(){
  var n = results.filter(Boolean).length;
  var miss = biggestMiss();
  var lines = ['REDACTED — I named '+n+' of '+QUOTES.length+'.'];
  if(miss) lines.push('My finest misjudgement: I was certain '+miss.q.answer
    +' ('+yearStr(miss.q.year)+') was '+miss.guess+'.');
  else lines.push('Nothing got past me.');
  lines.push(results.map(function(r){ return r?'✓':'✗'; }).join(''));
  return lines.join('\n');
}
function share(){
  var t = shareText(), btn = $('share'), done = function(){
    btn.textContent = 'Copied.';
    setTimeout(function(){ btn.innerHTML = 'Copy &amp; share'; }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); });
  }else{ fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
