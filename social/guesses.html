<!doctype html>
<html><head><meta charset="utf-8">
<title>Redacted Guesses</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{ --paper:#f6f2e8; --page:#fbf8f1; --ink:#211d15; --muted:#6b6353; --rule:#ddd5c2; --redact:#17130c;
  --serif:'EB Garamond', Georgia, serif; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:var(--paper);font-family:var(--serif);color:var(--ink);
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.page{width:960px;height:960px;background:var(--page);border:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;padding:52px 64px 44px;text-align:center}
.head{font-variant:small-caps;letter-spacing:.35em;font-size:26px;color:var(--muted)}
.title{font-size:52px;font-weight:600;letter-spacing:.14em;margin-top:14px}
.title .tbar{background:var(--redact);color:transparent;padding:0 .06em}
.hero{margin-top:30px;font-size:112px;line-height:1;font-weight:600}
.sub{font-style:italic;font-size:36px;color:var(--muted);margin-top:14px;max-width:30ch;line-height:1.3}
.ast{color:var(--muted);letter-spacing:.6em;margin:26px 0 18px;font-size:22px}
.lab{font-variant:small-caps;letter-spacing:.22em;font-size:22px;color:var(--muted);margin-bottom:18px}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 26px;max-width:820px}
.w{font-size:38px;color:var(--muted)}
.w.b{font-weight:600;color:var(--ink)}
.foot{margin-top:auto;font-size:22px;color:var(--muted);letter-spacing:.04em}
</style></head><body>
<div class="page">
  <div class="head">a play-once game</div>
  <div class="title">RE<span class="tbar">DAC</span>TED</div>
  <div class="hero">2 of 5</div>
  <div class="sub">quotes have never been guessed correctly</div>
  <div class="ast">* * *</div>
  <div class="lab">what players guessed</div>
  <div class="cloud" id="cloud"></div>
  <div class="foot">play.annmarieguzzi.com</div>
</div>
<script>
// typed guesses Oct 5–9 2026; case, spacing and plurals merged
var W=[['reading',1],['cars',2],['steam',1],['democracy',1],['recording',1],['computers',5],['typewriter',1],
 ['CDs',1],['population',1],['radio',2],['animation',1],['electricity',1],['books',4],
 ['travel',1],['calculators',1],['manufacturing',1],['photography',2],['print',1]];
document.getElementById('cloud').innerHTML=W.map(function(x){
  var n=x[1], sz=34+(n>1?8+n*4:0);
  return '<span class="w'+(n>1?' b':'')+'" style="font-size:'+sz+'px">'+x[0]+'</span>';
}).join('');
</script>
</body></html>
